      const result = await send({
        type,
        registrationId: panel.id,
        annotationControls: {
          controlsMode: "replace",
          controls: [...(panel.accepted ?? []), control],
        },
        targets: [{ ...target, visible: panel.visible }],
      });
      panel.inFlight = false;
      if (panel.disposed) {
        return;
      }
      if (Array.isArray(result?.annotationControls?.controls)) {
        panel.accepted = result.annotationControls.controls;
      } else {
        panel.controls = panel.controls.filter(
          (candidate) => candidate.callback !== control.callback,
        );
        panel.bindings.delete(control.callback);
        if (type === "register") {
          dispose(panel);
          return;
        }
      }
      syncPreviews();
    });
  }

  // Object bindings and the sandbox bridge; the host owns all controls UI.
  globalThis.Tweak = class Tweak {
    #panel;
    #disposed = false;

    constructor({ container, onChange }) {
      if (!this.supported) {
        return;
      }
      if (
        !(container instanceof Element) ||
        container.ownerDocument !== document
      ) {
        throw new TypeError("Tweak needs a component element as its container");
      }
      let targetId = targetIds.get(container);
      if (targetId == null) {
        targetId = String(++nextTargetId);
        targetIds.set(container, targetId);
      }
      this.#panel = {
        id: `tweak-${++nextPanelId}`,
        targetId,
        target: new WeakRef(container),
        onChange,
        bindings: new Map(),
        nextControlId: 0,
        controls: [],
        visible:
          container.closest(".viz-carousel > [data-variant][hidden]") == null,
        accepted: null,
        pending: Promise.resolve(),
        inFlight: false,
        disposed: false,
      };
    }

    get supported() {
      return callTool != null && !stopped;
    }

    addSlider(
      object,
      property,
      { min, max, step = 1, unit, label, reference } = {},
    ) {
      return this.#bind(object, property, {
        type: "range",
        label: unit ? `${label ?? property} (${unit})` : (label ?? property),
        reference,
        currentValue: object[property],
        min,
        max,
        step,
      });
    }

    addColorPicker(object, property, { label = property, reference } = {}) {
      return this.#bind(object, property, {
        type: "color",
        label,
        reference,
        currentValue: object[property],
      });
    }

    addToggle(object, property, { label = property, reference } = {}) {
      return this.#bind(object, property, {
        type: "toggle",
        label,
        reference,
        currentValue: object[property],
      });
    }

    addSelect(object, property, { options, label = property, reference }) {
      return this.#bind(object, property, {
        type: "select",
        label,
        reference,
        currentValue: object[property],
        options: options.map((option) =>
          typeof option === "string"
            ? { label: option, value: option }
            : { label: option.label, value: option.value },
        ),
      });
    }

    dispose() {
      this.#disposed = true;
      if (this.#panel != null) {
        dispose(this.#panel);
      }
    }

    #bind(object, property, definition) {
      const panel = this.#panel;
      if (this.#disposed || panel?.disposed) {
        throw new Error("Tweak has been disposed");
      }
      if (!this.supported) {
        return this;
      }
      if (!isValue(definition, definition.currentValue)) {
        throw new TypeError("Tweak bindings require a valid current value");
      }
      if (
        panel.controls.length >= 12 ||
        (!panels.has(panel.id) && panels.size >= 64)
      ) {
        throw new RangeError("Too many Tweak controls");
      }
      const callback = `${panel.id}-${++panel.nextControlId}`;
      const payload = JSON.stringify({
        controlsMode: "replace",
        controls: [...panel.controls, { ...definition, callback }],
      });
      if (payload.length > 16_384) {
        throw new RangeError("Tweak controls exceed the maximum size");
      }
      const annotationControls = JSON.parse(payload);
      const control = annotationControls.controls.at(-1);
      const target = targetSnapshot(panel);
      panel.controls = annotationControls.controls;
      panel.bindings.set(callback, {
        panel,
        object,
        property,
        control,
      });
      panels.set(panel.id, panel);
      queue(panel, control, target);
      return this;
    }
  };

  function onGlobals(event) {
    const globals = event.detail?.globals;
    if (globals == null || !Object.hasOwn(globals, "visualizationAnnotation")) {
      return;
    }
    const next = globals.visualizationAnnotation;
    if (
      next != null &&
      (typeof next.active !== "boolean" ||
        !Array.isArray(next.changes) ||
        next.changes.length > 1024 ||
        next.changes.some(
          (change) =>
            change == null ||
            typeof change.registrationId !== "string" ||
            typeof change.targetId !== "string" ||
            !Array.isArray(change.annotationControlChanges) ||
            change.annotationControlChanges.length > 12 ||
            change.annotationControlChanges.some(
              (edit) => edit == null || typeof edit.callback !== "string",
            ),
        ))
    ) {
      return;
    }
    command = next;
    syncPreviews();
  }

  function close() {
    command = { ...command, active: false };
    void send({ type: "escape" });
  }

  function onPointerEvent(event) {
    if (!command?.active || event.button !== 0 || event.defaultPrevented) {
      return;
    }
    if (
      event.target instanceof Element &&
      event.target.closest(".viz-carousel > .viz-carousel-controls") != null
    ) {
      return;
    }
    const activeOwners = owners();
    for (const target of event.composedPath()) {
      const panel = activeOwners.get(target);
      if (panel != null) {
        if (event.type === "click") {
          void send({
            type: "select",
            registrationId: panel.id,
            targetId: panel.targetId,
          });
        }
        event.preventDefault();
        event.stopImmediatePropagation();
        return;
      }
    }
    if (event.type === "click") {
      close();
    }
  }

  function onKeyDown(event) {
    if (
      !command?.active ||
      event.key !== "Escape" ||
      event.defaultPrevented ||
      event.isComposing
    ) {
      return;
    }
    event.preventDefault();
    close();
  }

  function onPageHide(event) {
    if (!event.isTrusted) {
      return;
    }
    stopped = true;
    command = null;
    syncPreviews();
    for (const panel of panels.values()) {
      dispose(panel);
    }
    observer.disconnect();
    globalThis.removeEventListener("openai:set_globals", onGlobals);
    globalThis.removeEventListener("pointerdown", onPointerEvent, true);
    globalThis.removeEventListener("mousedown", onPointerEvent, true);
    globalThis.removeEventListener("click", onPointerEvent, true);
    globalThis.removeEventListener("keydown", onKeyDown);
    globalThis.removeEventListener("pagehide", onPageHide);
  }

  const observer = new MutationObserver(() => {
    for (const panel of panels.values()) {
      const target = liveTarget(panel);
      if (target == null) {
        if (command?.active && command.selection?.registrationId === panel.id) {
          close();
        }
        dispose(panel);
        continue;
      }
      const visible =
        target.closest(".viz-carousel > [data-variant][hidden]") == null;
      if (visible === panel.visible) {
        continue;
      }
      panel.visible = visible;
      panel.pending = panel.pending.then(async () => {
        if (panel.disposed || stopped || panel.accepted == null) {
          return;
        }
        if (liveTarget(panel) == null) {
          dispose(panel);
          return;
        }
        await send({
          type: "update",
          registrationId: panel.id,
          annotationControls: {
            controlsMode: "replace",
            controls: panel.accepted,
          },
          targets: [targetSnapshot(panel)],
        });
      });
    }
  });
  if (callTool != null) {
    observer.observe(document, {
      childList: true,
      subtree: true,
      attributes: true,
      attributeFilter: ["hidden"],
    });
    globalThis.addEventListener("openai:set_globals", onGlobals);
    globalThis.addEventListener("pointerdown", onPointerEvent, true);
    globalThis.addEventListener("mousedown", onPointerEvent, true);
    globalThis.addEventListener("click", onPointerEvent, true);
    globalThis.addEventListener("keydown", onKeyDown);
    globalThis.addEventListener("pagehide", onPageHide);
    onGlobals({ detail: { globals: globalThis.openai } });
  }
})();
</script>

.banner:before{display:none}.campaign h1{font-style:italic;text-shadow:0 2px 10px #000}.campaign h1 em{font-style:inherit;text-shadow:0 0 .85rem #ef651d50}
.count{background:linear-gradient(145deg,#10151af5,#101010f0);border-color:#f3854b96;box-shadow:inset 0 0 .7rem #ec722018,0 0 1.15rem #ef731c33}
.team{position:relative;isolation:isolate;box-shadow:inset 0 0 1.15rem var(--glow),0 0 .75rem var(--glow)}
.team:after{content:'';position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:radial-gradient(ellipse 44% 9% at 100% 100%,var(--glow),transparent),radial-gradient(ellipse 33% 6% at 10% 0,var(--glow),transparent)}
.teamhead{position:relative;background:linear-gradient(105deg,var(--glow),#0a131c 66%,var(--glow))}.teamhead:after{content:'';position:absolute;bottom:-1px;left:6%;width:64%;height:2px;background:linear-gradient(90deg,transparent,var(--edge),#fff,var(--edge),transparent);box-shadow:0 0 .42rem var(--edge)}
.teamhead:before{filter:drop-shadow(0 0 .4rem var(--edge))}.medal{border-radius:50%;mask-image:radial-gradient(circle,#000 57%,#000d 67%,transparent 75%);-webkit-mask-image:radial-gradient(circle,#000 57%,#000d 67%,transparent 75%);width:4.8rem}.portrait{width:4.35rem}.first .portrait{box-shadow:0 0 .8rem var(--glow),0 0 .2rem var(--edge)}
.sales strong{font-size:1.85rem;letter-spacing:-.055em}.who{font-size:1.34rem}.first .sales strong{color:#fff5eb}
.track{background:#27313b;box-shadow:inset 0 1px .16rem #0008}.track>b{background:linear-gradient(90deg,#da4e13,#f36f21 70%,#ffac66);box-shadow:0 0 .6rem #f36f2155,inset 0 1px 0 #ffc79a77}
.mini{background:#27343f}.mini i{background:linear-gradient(90deg,#537285,#93b4ca)}.mix:has(.open) .mini i{background:linear-gradient(90deg,#068d65,#35dea4);box-shadow:0 0 .45rem #16c58955}
.lock.open{box-shadow:0 0 .6rem #15da9455}.bonus.on{background:radial-gradient(ellipse at 50% 0,#14603f,#08271e 78%);border:1px solid #4be5a6;box-shadow:inset 0 0 .8rem #3bf39d24,0 0 .8rem #23db8433}.bonus.on .ico{filter:drop-shadow(0 0 .24rem #6bffc9)}.bonus.on b{text-shadow:0 0 .55rem #76ffad66}
@media(prefers-reduced-motion:no-preference){.track>b,.mini i{animation:fill-score 1.35s cubic-bezier(.18,.77,.22,1) backwards;transition:none}@keyframes fill-score{from{width:var(--from,0%)}}}
@media(max-width:760px) and (orientation:portrait){.portrait,.medal{width:2.8rem}.sales strong{font-size:1.25rem}}

.sales-meter{position:relative;padding-bottom:1.15rem}
.sales-meter .track{overflow:visible}.sales-meter .track>.animated-fill{position:relative;width:var(--end);height:100%;overflow:visible;border-radius:inherit;background:linear-gradient(180deg,#ffc481,#ff9844 24%,#f36f21 64%,#db5818);box-shadow:inset 0 1px 0 #ffdfb887;transition:none;animation:none}
.sales-meter .animated-fill.lit:after{content:'';position:absolute;inset:0 0 0 auto;width:min(100%,.65rem);border-radius:0 1rem 1rem 0;background:linear-gradient(90deg,transparent,#ffd59c);box-shadow:.18rem 0 .7rem #ff9c49ad}
.sales-meter .target{right:0;height:155%;top:-27%;background:#fff;z-index:1}
.threshold-label{position:absolute;right:0;bottom:0;color:#dce3eb;white-space:nowrap;font:600 .72rem/1.2 'Segoe UI',sans-serif}
.card .mix{margin-top:.48rem}.next.near{display:inline-block;padding:.24rem .55rem;border:1px solid #f39547;border-radius:.45rem;color:#fff0d8;background:#302015;font-weight:700;box-shadow:0 0 .6rem #f36f2126}
.excess{display:block;margin-top:.4rem;color:#ffae64;font-size:.94rem;letter-spacing:-.02em}
@media(min-width:761px){.card .identity{display:grid;grid-template-columns:auto auto;justify-content:start;align-items:center;gap:.35rem .7rem}.card .medal{grid-row:span 2}.card .portrait{justify-self:center;width:4.65rem}.card .who{text-align:center;font-size:1.44rem}}
@media(prefers-reduced-motion:no-preference){
.sales-meter .track>.animated-fill{animation:growScore 2.3s cubic-bezier(.25,.72,.27,1) var(--delay) backwards}
@keyframes growScore{from{width:var(--start)}to{width:var(--end)}}
.bonus.on.ignite{animation:igniteBonus .85s ease-out var(--ignite-delay,0s) backwards}
@keyframes igniteBonus{0%{border-color:#40504d;background:#141a19;color:#94a4a0;box-shadow:none}65%{border-color:#c2ffe1;box-shadow:0 0 1.4rem #45ee9c9c,inset 0 0 .6rem #45ee9c42}100%{border-color:#4be5a6;box-shadow:inset 0 0 .8rem #3bf39d24,0 0 .8rem #23db8433}}
}

/* Halo ancorado no limite do faturamento de cada pessoa. */
.sales-meter .animated-fill.lit::before {
 content:'';position:absolute;top:50%;right:0;width:.86rem;height:1.1rem;
 border-radius:50%;background:radial-gradient(ellipse,#fff1cdbf 0%,#ffb5658a 24%,#ff782b24 56%,transparent 75%);
 pointer-events:none;transform:translate(50%,-50%);opacity:.65
}
@media(prefers-reduced-motion:no-preference){
 .sales-meter .animated-fill.lit::before{
  animation:pulseRevenueTip 2.6s ease-in-out infinite;animation-delay:var(--delay,0s)
 }
 @keyframes pulseRevenueTip{
  0%,100%{transform:translate(50%,-50%) scale(.78);opacity:.45}
  52%{transform:translate(50%,-50%) scale(1.95,1.45);opacity:1}
 }

<aside id="celebration" role="status" hidden=""><div class="burst" aria-hidden="true">✦</div><div><small id="awardType"></small><strong id="awardName"></strong><span id="awardValue"></span></div></aside>
<script>
// CADASTRO PJ — acrescente um nome entre aspas, igual à etiqueta da Groner.
const REPRESENTANTES = [
  'LUCAS PABLO',
  'MARCELO MOREIRA',
  'IVANILDO SIQUEIRA',
  'CARLOS REIS',
  'TAYNARA DOMINGUES'
];
// Configure uma fonte específica do placar PJ. Uma linha por venda confirmada,
// apenas da campanha, com id único, valor em reais e etiquetas em array de textos.
// A fonte deve ser própria para exposição pública e conter apenas os campos do placar.
const FONTE_PJ = ''; // URL REST da view, sem parâmetros.
const CHAVE_PUBLICA = ''; // Chave publishable do Supabase.
const MODO_TESTE = !FONTE_PJ;
const META_INDIVIDUAL = 80000, PERCENTUAL_EXTRA = 60;
const FIM_EXCLUSIVO = '2026-12-01T00:00:00-03:00';
const FORMAS_VALIDAS = ['Santander','BV','À Vista 100%','Cartão 100%','À Vista e Cartão 100%'];
const EQUIPES = [{titulo:'Representantes comerciais · PJ', campo:'representante', base:500, extra:300, participantes:REPRESENTANTES}];
const $ = id => document.getElementById(id);
const moeda = (v,casas=0) => v.toLocaleString('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:casas,maximumFractionDigits:casas});
const valor = centavos => moeda(centavos/100, centavos%100 ? 2 : 0);
const normal = s => String(s??'').trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ');
const validas = new Set(FORMAS_VALIDAS.map(normal));
const esc = v => String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const porcento = n => (Math.floor(n*10)/10).toLocaleString('pt-BR')+'%';
const limite = n => Math.max(0,Math.min(100,n));
function exemplo(){
 return [[88000,57200],[80000,40000],[64000,41600],[48000,24000],[32000,24000]].slice(0,REPRESENTANTES.length).flatMap(([total,qual],i)=>[
 {id:2*i+1,valor:qual,etiquetas:[REPRESENTANTES[i],'BV']},{id:2*i+2,valor:total-qual,etiquetas:[REPRESENTANTES[i]]}]);
}
function consolidar(linhas){
 const pessoas=new Map(REPRESENTANTES.map(nome=>[normal(nome),{nome,total:0,qual:0}]));
 if(pessoas.size!==REPRESENTANTES.length)throw Error('Nome duplicado no cadastro PJ');
 const vistos=new Set();
 let conflitos=0;
 for(const venda of linhas){
   if(venda.id==null || vistos.has(String(venda.id)))throw Error('Identificador de venda inválido ou duplicado');
   vistos.add(String(venda.id));
   if(!Array.isArray(venda.etiquetas)||venda.etiquetas.some(x=>typeof x!=='string'))throw Error('Formato de etiquetas inválido');
   const tags=[...new Set(venda.etiquetas.map(normal))];
   const nomes=tags.filter(t=>pessoas.has(t));
   if(nomes.length>1){conflitos++;continue;}
   if(!nomes.length)continue;
   const raw=venda.valor;
   const centavos=Math.round(Number(raw)*100);
   if(!['number','string'].includes(typeof raw)||String(raw).trim()===''||!Number.isSafeInteger(centavos)||centavos<0)throw Error('Valor inválido');
   const p=pessoas.get(nomes[0]);
   p.total+=centavos;
   if(tags.some(t=>validas.has(t)))p.qual+=centavos;
 }
 return {conflitos, grupos:[[...pessoas.values()].sort((a,b)=>b.total-a.total||b.qual-a.qual||a.nome.localeCompare(b.nome,'pt-BR'))]};
}
let dados=null, paginas=[0];
const barrasAnteriores=new Map();
function card(p,pos,e){
 const meta=p.total/META_INDIVIDUAL, mix=p.total?100*p.qual/p.total:0;
 const nivel=nivelBonus(p), qual=p.total>0 && p.qual*100>=PERCENTUAL_EXTRA*p.total;
 const saldo=p.total-META_INDIVIDUAL*100;
 let objetivo;
 if(saldo<0) objetivo='Faltam '+valor(-saldo)+' para atingir a meta';
 else if(nivel===1){
   // Cada nova venda válida aumenta tanto o valor qualificado quanto o total vendido.
   const faltaValida=Math.ceil((PERCENTUAL_EXTRA*p.total-100*p.qual)/(100-PERCENTUAL_EXTRA));
   objetivo='Venda mais '+valor(faltaValida)+' nas formas válidas para liberar '+moeda(e.extra);
 }else objetivo='Bônus completo · '+moeda(e.base+e.extra);
 const iniciais=p.nome.split(/\s+/).filter((_,i,a)=>i===0||i===a.length-1).map(s=>[...s][0]).join('').toUpperCase();
 function selo(quantia,ativo,extra){
   const path=ativo?(extra?'M8 10V7a4 4 0 0 1 8 0 M6 10h12v10H6z':'m4 12 5 5L20 6'):'M8 10V7a4 4 0 0 1 8 0v3 M6 10h12v10H6z';
   return `<span class="bonus ${ativo?'on':''} ${ativo && anterior.nivel<(extra?2:1)?'ignite':''}" style="--ignite-delay:${pos*.19+1.85+(extra ? .35 : 0)}s"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="${path}"/></svg><span><b>${moeda(quantia)}</b><small>${ativo?(extra?'Destravado':'Liberado'):'Bloqueado'}</small></span></span>`;
 }
 const id=e.campo+'|'+p.nome;
 const anterior=barrasAnteriores.get(id)||{meta:0,mix:0,nivel:0};
 const larguraMeta=limite(meta), larguraMix=limite(mix*100/PERCENTUAL_EXTRA);
 barrasAnteriores.set(id,{meta:larguraMeta,mix:larguraMix,nivel});
 return `<article class="card ${pos===0?'first':''}">
   <div class="identity"><span class="medal m${pos+1}" aria-label="${pos+1}º lugar"><b>${pos+1}º</b></span><span class="portrait">${esc(iniciais)}</span><h3 class="who">${esc(p.nome)}</h3></div>
   <div class="performance"><span class="cap">Faturamento atual</span><div class="sales"><strong>${valor(p.total)}</strong><span>${porcento(meta)}</span></div>
   <div class="sales-meter" style="--delay:${pos*.19}s">
     <div class="track" title="Meta individual: R$ 80 mil"><b class="animated-fill ${larguraMeta>0?'lit':''}" style="--start:${anterior.meta}%;--end:${larguraMeta}%"></b><i class="target"></i></div>
     <span class="threshold-label">100% da meta</span></div>
   ${saldo<0?`<strong class="remaining">${objetivo}</strong>`:""}
   <div class="mix"><span class="lock ${qual?'open':''}" aria-hidden="true"></span><div><b>${porcento(mix)} qualificado</b><div class="mini"><i style="--from:${anterior.mix}%;width:${larguraMix}%"></i></div></div></div>
   ${saldo>=0?`<small class="next ${nivel===1 && mix>=55?'near':''}">${objetivo}</small>`:""}${saldo>0?'<strong class="excess">+ '+valor(saldo)+' acima da meta</strong>':''}</div>
   <div class="bonuses">${selo(e.base,nivel>=1,false)}${selo(e.extra,nivel===2,true)}</div>
 </article>`;
}
EQUIPES.forEach((e,i)=>{
 $('teams').insertAdjacentHTML('beforeend',`<section class="team"><header class="teamhead"><div><h2>${e.titulo}</h2><p>Meta ${moeda(META_INDIVIDUAL)} · ${moeda(e.base)} + ${moeda(e.extra)} extra</p></div><div class="right" id="nav${i}"></div></header><div class="rankings" id="lista${i}"></div></section>`);
});
function capacidade(){return innerWidth<=760 ? Math.max(1,REPRESENTANTES.length) : 6;}
function pintar(){
 if(!dados)return;
 const tam=capacidade();
 dados.grupos.forEach((grupo,i)=>{
 const max=Math.max(1,Math.ceil(grupo.length/tam));paginas[i]%=max;
 const ini=paginas[i]*tam, lista=$('lista'+i);
 lista.style.gridTemplateRows=innerWidth<=760?'none':'repeat(3,minmax(0,1fr))';
 lista.innerHTML=grupo.slice(ini,ini+tam).map((p,j)=>card(p,ini+j,EQUIPES[i])).join('')||'<div class="empty">Nenhuma venda confirmada no período.</div>';
 $('nav'+i).innerHTML=max>1?'<button data-dir="-1" aria-label="Página anterior">‹</button> '+(paginas[i]+1)+'/'+max+' <button data-dir="1" aria-label="Próxima página">›</button>':'';
 $('nav'+i).onclick=ev=>{if(ev.target.dataset.dir){paginas[i]=(paginas[i]+Number(ev.target.dataset.dir)+max)%max;pintar();}};
 });
}
function nivelBonus(p){
 if(p.total<META_INDIVIDUAL*100)return 0;
 return p.qual*100>=PERCENTUAL_EXTRA*p.total?2:1;
}
const filaPremios=[];
let celebrando=false;
function exibirPremio(){
 if(celebrando||!filaPremios.length)return;
 celebrando=true;
 const {nome,quantia,extra,teste}=filaPremios.shift();
 $('awardType').textContent=teste?'Prévia da celebração':extra?'Bônus extra destravado':'Meta alcançada';
 $('awardName').textContent=nome;
 $('awardValue').textContent=moeda(quantia)+' em bônus '+(extra?'extra':'liberado');
 $('celebration').hidden=false;
 setTimeout(()=>{$('celebration').hidden=true;celebrando=false;exibirPremio();},4500);
}
function detectarPremios(antes,depois){
 depois.grupos.forEach((grupo,i)=>{
 const anteriores=new Map(antes.grupos[i].map(p=>[p.nome,nivelBonus(p)]));
 for(const p of grupo){
 const atual=nivelBonus(p), anterior=anteriores.get(p.nome)??0;
 for(let nivel=anterior+1;nivel<=atual;nivel++){
 const extra=nivel===2;
 filaPremios.push({nome:p.nome,extra,quantia:extra?EQUIPES[i].extra:EQUIPES[i].base});
 }
 }
 });
 exibirPremio();
}
$('previewBonus').hidden=!MODO_TESTE;
$('previewBonus').onclick=()=>{
 if(celebrando||!dados)return;
 const p=dados.grupos[0][0];

            parseFloat(bodyStyle.paddingTop),

      .callTool(

    if (heightReportTimer != null) {
      return;

<script id="codex-visualization-tabs">
(() => {
  const selector = '.nav[role="tablist"] [role="tab"]';
  const disabled = ':disabled,[aria-disabled="true"]';
  const selectTab = (selected) => {
    const panelId = selected.getAttribute("aria-controls");
    for (const tab of selected.closest('[role="tablist"]').querySelectorAll('[role="tab"]')) {
      const active = tab === selected;
      tab.classList.toggle("active", active);
      tab.setAttribute("aria-selected", String(active));
      const id = tab.getAttribute("aria-controls");
      const panel = id && document.getElementById(id);
      if (panel != null) {
        panel.hidden = id !== panelId;
        if (!panel.hidden && selected.id) {
          panel.setAttribute("aria-labelledby", selected.id);
        }
      }
    }
  };
  const interact = (event) => {
    const tab = event.target?.closest?.(selector);
    if (event.defaultPrevented || tab == null || tab.matches(disabled)) {
      return;
    }
    if (event.type === "click") {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest('[role="tablist"]').querySelectorAll('[role="tab"]'),
    ).filter((candidate) => !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === "ArrowRight" || event.key === "ArrowDown") {
      next = (current + 1) % tabs.length;
    } else if (event.key === "ArrowLeft" || event.key === "ArrowUp") {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === "Home") {
      next = 0;
    } else if (event.key === "End") {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll('.nav[role="tablist"]')) {
    const selected =
      list.querySelector('[role="tab"][aria-selected="true"]') ??
      list.querySelector('[role="tab"].active') ??
      list.querySelector('[role="tab"]');
    if (selected != null) {
      selectTab(selected);
    }
  }
  document.addEventListener("click", interact);
  document.addEventListener("keydown", interact);
  window.addEventListener("pagehide", () => {
    document.removeEventListener("click", interact);
    document.removeEventListener("keydown", interact);
  }, { once: true });
})();
</script>
<script id="codex-visualization-carousel">

        });
        root.dataset.activeVariant = panels[active].dataset.variant;
        count.textContent = `${active + 1} / ${panels.length}`;
        name.textContent = panels[active].dataset.variant;
        picker.open = false;
        mousePointerId = null;
        if (changed) {
          status.textContent = `${count.textContent}: ${name.textContent}`;
        }
      };
      previous.addEventListener("click", () =>
        select((active + panels.length - 1) % panels.length),
      );
      next.addEventListener("click", () =>
        select((active + 1) % panels.length),
      );
      picker.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && picker.open) {
          event.preventDefault();
          picker.open = false;
          mousePointerId = null;
          summary.focus();
          return;
        }
        if (event.altKey || event.ctrlKey || event.metaKey) {
          return;
        }
        const index = choices.indexOf(document.activeElement);
        let nextIndex;
        if (event.key === "ArrowDown") {
          nextIndex = index < 0 ? active : (index + 1) % choices.length;
        } else if (event.key === "ArrowUp") {
          nextIndex = index < 0 ? active : (index + choices.length - 1) % choices.length;
        } else if (picker.open && event.key === "Home") {
          nextIndex = 0;
        } else if (picker.open && event.key === "End") {
          nextIndex = choices.length - 1;
        } else {
          return;
        }
        event.preventDefault();
        picker.open = true;
        choices[nextIndex].focus();
      });
      picker.addEventListener("focusout", (event) => {
        if (!picker.contains(event.relatedTarget)) {
          picker.open = false;
          mousePointerId = null;
        }
      });
      const dismiss = (event) => {
        if (!summary.contains(event.target)) {
          mousePointerId = null;
        }
        if (!picker.contains(event.target)) {
          picker.open = false;
        }
      };
      const endPointerSelection = () => {
        mousePointerId = null;
      };
      const sizePicker = () => {
        root.style.setProperty(
          "--viz-carousel-picker-height",
          `${picker.open ? options.offsetHeight : 0}px`,
        );
      };
      picker.addEventListener("toggle", sizePicker);
      window.addEventListener("resize", sizePicker);
      document.addEventListener("pointerdown", dismiss);
      document.addEventListener("pointerup", endPointerSelection);
      document.addEventListener("pointercancel", endPointerSelection);
      window.addEventListener("blur", endPointerSelection);
      window.addEventListener(
        "pagehide",
        () => {
          document.removeEventListener("pointerdown", dismiss);
          document.removeEventListener("pointerup", endPointerSelection);
          document.removeEventListener("pointercancel", endPointerSelection);
          window.removeEventListener("blur", endPointerSelection);
          window.removeEventListener("resize", sizePicker);
        },
        { once: true },
      );
      root.append(controls, status);
      select(0);
    }
  })();
</script>
<script id="codex-visualization-lucide" async="" src="https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js"></script>
<script>
(() => {
  const initialize = () => {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById("codex-visualization-lucide")
    ?.addEventListener("load", initialize, { once: true });
})();
</script>
